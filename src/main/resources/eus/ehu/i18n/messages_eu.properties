# Dialogs texts
privacy_policy_text=Pribatutasun Politika\n\nPribatutasun Politika honek azaltzen du nola SteamAssist-ek zure Steam kontuari buruzko informazioa bildu, erabili eta babesten duen.\nGure zerbitzua erabiliz, politika honen baldintzak onartzen dituzu.\n\nBiltzen dugun informazioa\nZure Steam kontua gure zerbitzura konektatzen duzunean, ondorengo datuak bildu ditzakegu:\n\nZure Steam ID (publikoki eskuragarria)\n\nZure profil publikoko datuak (adib., avatarra, bistaratzeko izena)\n\nZure liburutegiko jokoen zerrenda\n\nJoko bakoitzaren jokatze-denbora\n\nSteam Web API bidez publikoki eskuragarri dauden datuak bakarrik atzitzen ditugu, eta ez dugu inoiz zure Steam pasahitza edo informazio pribaturik biltzen.\n\nNola erabiltzen ditugun zure datuak\nZure datuak zorrozki ondorengo helburuetarako erabiltzen ditugu:\n\nZure jokatze-denboraren arabera pertsonalizatutako joko-gomendioak sortzeko\n\nGure plataforman zure profilean gehien jokatutako jokoak erakusteko (bidezkoa bada)\n\nEz ditugu zure datuak hirugarrenekin saltzen edo partekatzen.\n\nDatuen Bilketa eta Atxikipena\nZure Steam datuak gure zerbitzari seguruetan gorde daitezke esperientzia arina eskaintzeko.\n\nZure datuak soilik gorago azaldutako helburuetarako beharrezkoak diren bitartean edo ezabatzea eskatzen duzun arte gordetzen ditugu.\n\nDatuen Partekatzea\nEz ditugu zure datuak hirugarrenekin partekatu, saldu edo alokatzen.\nZure datuak soilik gure zerbitzuan zure esperientzia hobetzeko erabiltzen dira.\n\nSegurtasuna\nIndustriako segurtasun-neurri estandarrak ezartzen ditugu zure datuak baimenik gabeko sarbide edo erabilera okerretik babesteko.\nHala ere, interneten bidezko transmisio-metodo bat ere ez da %100 segurua.\n\nPolitika honen aldaketak\nPribatutasun Politika hau noizean behin eguneratu dezakegu.\nAldaketak orri honetan argitaratuko dira eguneratutako datarekin.\nArgitaratutako aldaketen ondoren gure zerbitzua erabiltzen jarraitzeak baldintza berriak onartzea dakar.

about_us_text=Gure taldea hurrengo kideek osatzen dute:\n    Cherqui Madarieta, Yunes\n    Elortondo Garro, Oier\n    Ituarte Arroitajauregi, Gorka\n    Zunzunegui Mintegui, Alejandro\n    Gonzalez Blazquez, Ivan

contact_us_text=Harremanetarako\nAplikazio edo Pribatutasun Politikari buruzko galderarik baduzu, jarri gurekin harremanetan:\n\n? [steamassist55@gmail.com]

