privacyPolicy=Pribatutasun Politika\n\nPribatutasun Politika honek azaltzen du SteamAssist-ek nola biltzen, erabiltzen, eta babesten duen zure Steam kontuari buruzko informazioa. Gure zerbitzua erabiliz, politika honen baldintzak onartzen dituzu.\n\nBiltzen dugun Informazioa\nZure Steam kontua gure zerbitzura konektatzen duzunean, honako datu hauek bil ditzakegu:\n\nZure Steam ID (publikoki eskuragarria)\n\nZure profil publikoaren datuak (adibidez, avatarra, erakusteko izena)\n\nZure liburutegiko jokoen zerrenda\n\nJoko bakoitzeko jokatutako denbora\n\nSteam Web API-ren bidez publikoki eskuragarri dauden datuak bakarrik atzitzen ditugu, eta inoiz ez dugu biltzen zure Steam pasahitza edo bestelako informazio pribaturik.\n\nNola Erabiltzen ditugun Zure Datuak\nZure datuak zorrozki helburu hauetarako erabiltzen ditugu:\n\nZure jokatze-denboraren arabera gomendio pertsonalizatuak sortzeko\n\nZure jokorik jokatuenak zure profilean erakusteko gure plataforman (aplikagarria bada)\n\nEz ditugu zure datuak saltzen edo hirugarrenekin partekatzen.\n\nDatuen Biltegiratze eta Atxikipena\nZure Steam datuak gure zerbitzari seguruetan gorde daitezke esperientzia eraginkor bat eskaintzeko.\n\nZure datuak goian azaldutako helburuetarako beharrezkoa den denboran bakarrik atxikitzen ditugu edo zuk ezabatzea eskatu arte.\n\nDatu Partekatzea\nEz ditugu zure datuak hirugarrenei partekatu, saldu, edo alokatu. Zure datuak gure zerbitzuan zure esperientzia hobetzeko bakarrik erabiltzen dira.\n\nSegurtasuna\nIndustriako segurtasun-neurri estandarrak ezartzen ditugu zure datuak baimenik gabeko sarbideetatik edo erabilera okerretatik babesteko. Hala ere, interneten bidezko transmisio-metodo bat ere ez da %100 segurua.\n\nPolitika honen Aldaketak\nPribatutasun Politika hau noizbehinka eguneratu dezakegu. Aldaketak orri honetan argitaratuko dira, eguneratutako datarekin. Aldaketak argitaratu ondoren gure zerbitzua erabiltzen jarraitzen baduzu, baldintza berriak onartzen dituzula ulertuko da.
aboutUs=Talde honen kide gara:\n    Cherqui Madarieta, Yunes\n    Elortondo Garro, Oier\n    Ituarte Arroitajauregi, Gorka\n    Zunzunegui Mintegui, Alejandro\n    Gonzalez Blazquez, Ivan
