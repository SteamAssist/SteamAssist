privacyPolicy=Política de privacidad\n\nEsta Política de Privacidad explica cómo SteamAssist recopila, utiliza y protege la información relacionada con tu cuenta de Steam. Al usar nuestro servicio, aceptas los términos de esta política.\n\nInformación que recopilamos\nCuando conectas tu cuenta de Steam a nuestro servicio, podemos recopilar los siguientes datos:\n\nTu Steam ID (disponible públicamente)\n\nTu perfil público (por ejemplo, avatar, nombre de usuario)\n\nUna lista de juegos en tu biblioteca\n\nDatos de tiempo de juego para cada juego\n\nSolo accedemos a datos disponibles públicamente a través de la API Web de Steam, y nunca recopilamos tu contraseña de Steam ni ninguna información privada.\n\nCómo usamos tus datos\nUsamos tus datos estrictamente para los siguientes propósitos:\n\nGenerar recomendaciones de juegos personalizadas basadas en tu tiempo de juego\n\nMostrar tus juegos más jugados en tu perfil en nuestra plataforma (si aplica)\n\nNo vendemos ni compartimos tus datos con terceros.\n\nAlmacenamiento y retención de datos\nTus datos de Steam pueden almacenarse en nuestros servidores seguros para proporcionar una experiencia fluida.\n\nRetenemos tus datos solo mientras sea necesario para los propósitos descritos anteriormente o hasta que solicites su eliminación.\n\nCompartición de datos\nNo compartimos, vendemos ni alquilamos tus datos a terceros. Tus datos se utilizan únicamente para mejorar tu experiencia dentro de nuestro servicio.\n\nSeguridad\nImplementamos medidas de seguridad estándar de la industria para proteger tus datos contra accesos no autorizados o usos indebidos. Sin embargo, ningún método de transmisión por internet es 100% seguro.\n\nCambios en esta política\nPodemos actualizar esta Política de Privacidad de vez en cuando. Los cambios se publicarán en esta página con la fecha actualizada. El uso continuo de nuestro servicio después de que se publiquen los cambios constituye tu aceptación de los nuevos términos.
aboutUs=Somos un equipo compuesto por los siguientes miembros:\n    Cherqui Madarieta, Yunes\n    Elortondo Garro, Oier\n    Ituarte Arroitajauregi, Gorka\n    Zunzunegui Mintegui, Alejandro\n    Gonzalez Blazquez, Ivan
contactUs=Contáctanos\nSi tienes alguna pregunta sobre la aplicación o inquietudes sobre la Política de Privacidad o tus datos, puedes contactarnos en:\n\n\uD83D\uDCE7 [steamassist55@gmail.com]
